[project]
name = "agent-basic"
version = "0.1.0"
description = "Step-by-step lectures for building agents from scratch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.9.0",
    "openai>=2.43.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_001_500_lines_claudecode"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
